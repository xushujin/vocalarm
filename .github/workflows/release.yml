name: Release

# Only tag pushes build and publish. Pull requests and branch pushes never run this workflow.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3 (got: $TAG)" >&2
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "Minor and patch must be <= 99 to keep versionCode monotonic" >&2
            exit 1
          fi
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG -> versionName=$VERSION versionCode=$CODE"

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Missing secret ANDROID_KEYSTORE_BASE64" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vocalarm-release.jks"

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Build signed release
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/vocalarm-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -Pvocalarm.versionName=${{ steps.version.outputs.name }} \
            -Pvocalarm.versionCode=${{ steps.version.outputs.code }} \
            -Pvocalarm.githubOwner=${{ github.repository_owner }} \
            -Pvocalarm.githubRepo=${{ github.event.repository.name }}

      - name: Rename APK for the update checker
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "vocalarm-${{ steps.version.outputs.name }}.apk"

      - name: Verify APK signature
        shell: bash
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs \
            "vocalarm-${{ steps.version.outputs.name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Vocalarm ${{ steps.version.outputs.name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: vocalarm-${{ steps.version.outputs.name }}.apk
